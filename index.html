<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--side:#0b1220;--side2:#131c31;--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--pri:#2f5bea;--pri2:#1e40af;--ok:#059669;--bad:#dc2626;--warn:#d97706;--bd:#e5e9f2;--sh:0 1px 2px #0f172a0a,0 4px 14px #0f172a0a}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,Tahoma,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;font-size:15px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
aside{width:264px;background:linear-gradient(180deg,var(--side),var(--side2));color:#94a3b8;padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 26px;color:#fff;font-size:20px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#3b82f6,#6366f1);display:grid;place-items:center;font-weight:800;box-shadow:0 6px 16px #3b82f655}
aside nav{flex:1;overflow:auto}
aside a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;color:#94a3b8;cursor:pointer;margin-bottom:3px;font-weight:500;position:relative;transition:background .15s,color .15s}
aside a:hover{background:#ffffff0d;color:#e2e8f0}
aside a.on{background:#2f5bea26;color:#fff}
aside a.on:before{content:"";position:absolute;right:-16px;top:9px;bottom:9px;width:4px;border-radius:4px 0 0 4px;background:#60a5fa}
.me{background:#ffffff0a;border:1px solid #ffffff10;border-radius:14px;padding:12px;display:flex;gap:11px;align-items:center;color:#fff;margin-top:12px}
.me small{color:#94a3b8}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#6366f1);display:grid;place-items:center;font-weight:700;color:#fff;flex-shrink:0}
.out{margin-top:10px;display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;border-radius:11px;color:#fca5a5;background:#ef444414;cursor:pointer;font-weight:500}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{height:68px;background:#ffffffd9;backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.srch{display:flex;align-items:center;gap:10px;background:#f1f4fa;border:1px solid transparent;border-radius:12px;padding:0 14px;width:min(380px,50%);color:var(--mut)}
.srch:focus-within{background:#fff;border-color:var(--pri)}
.srch input{border:0;background:transparent;padding:11px 0;outline:0}
.bar-r{display:flex;align-items:center;gap:14px}
.bell{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:#fff;display:grid;place-items:center;color:var(--mut);cursor:pointer}
.bell i{position:absolute;top:10px;left:11px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid #fff}
main{padding:30px 28px 48px;max-width:1280px;width:100%}
h2{margin:0 0 4px;font-size:27px;font-weight:800;letter-spacing:-.2px}h3{margin:0 0 4px;font-size:17px}
.sub{color:var(--mut);margin:0 0 24px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;box-shadow:var(--sh)}
.card small{color:var(--mut)}.big{font-size:28px;font-weight:800;margin-top:8px}
.stat{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.c1{background:#e0e9ff;color:#2f5bea}.c2{background:#d1fae5;color:#059669}.c3{background:#fef3c7;color:#d97706}.c4{background:#fee2e2;color:#dc2626}
.hint{font-size:13px;color:var(--mut);margin-top:4px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.bars{display:flex;align-items:flex-end;gap:12px;height:190px;margin-top:18px;padding-bottom:4px;background:repeating-linear-gradient(to top,transparent 0 46px,#eef1f7 46px 47px)}
.bars div{flex:1;background:linear-gradient(180deg,#5b8cff,#2f5bea);border-radius:8px 8px 0 0;min-height:5px;position:relative;transition:filter .15s}
.bars div:hover{filter:brightness(1.1)}
.bars span{position:absolute;bottom:-26px;font-size:12px;color:var(--mut);width:100%;text-align:center}
table{width:100%;border-collapse:collapse}
th{background:#f8fafd;color:var(--mut);font-weight:600;font-size:13px;white-space:nowrap}
th,td{padding:14px 16px;text-align:right;border-bottom:1px solid var(--bd)}
th:first-child{border-radius:0 10px 10px 0}th:last-child{border-radius:10px 0 0 10px}
tbody tr:hover td,table tr:hover td{background:#fafbff}
tr:last-child td{border-bottom:0}
.card.scroll{padding:10px 14px}
.btn{border:0;border-radius:11px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#3b6cf5,#2f5bea);color:#fff;box-shadow:0 4px 12px #2f5bea40;display:inline-flex;align-items:center;gap:8px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.g{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 12px #05966940}
.btn.l{background:#eef1f7;color:var(--ink);box-shadow:none}
.btn.r{background:#fee2e2;color:var(--bad);padding:6px 14px;box-shadow:none;font-weight:500}
input,select{font:inherit;padding:11px 14px;border:1px solid var(--bd);border-radius:11px;width:100%;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px #2f5bea1f}
.btn:focus-visible,aside a:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
label{display:block;margin:14px 0 6px;font-size:14px;color:var(--mut);font-weight:500}
.tag{padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;background:#d1fae5;color:var(--ok)}.tag.w{background:#fee2e2;color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:28px}
.modal{position:fixed;inset:0;background:#0b122080;backdrop-filter:blur(3px);display:none;place-items:center;padding:16px;z-index:9}
.modal.on{display:grid}.box{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:470px;box-shadow:0 24px 60px #0b122055;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.row{display:flex;gap:10px;margin-top:20px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:14px}
.prod{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;transition:all .15s}
.prod:hover{border-color:var(--pri);box-shadow:0 6px 18px #2f5bea1f;transform:translateY(-2px)}
.tot{font-size:32px;color:var(--pri);font-weight:800;background:#eef3ff;border-radius:14px;padding:12px 18px;display:inline-block}
.scroll{overflow-x:auto}
@media(max-width:900px){body{flex-direction:column}aside{width:100%;height:auto;position:static;padding:12px}.brand{padding:0 6px 12px}aside nav{display:flex;overflow:auto;gap:4px}aside a{white-space:nowrap}aside a.on:before{display:none}.me,.out{display:none}.two{grid-template-columns:1fr}main{padding:18px 14px}.bar{padding:0 14px}}
@media print{aside,.bar,.btn,.prods,#q{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<aside>
  <div class="brand"><span class="logo">E</span><b>نظام ERP</b></div>
  <nav id="nav"></nav>
  <div class="out" tabindex="0">تسجيل الخروج</div>
  <div class="me"><div class="av">A</div><div><b>Ahmed</b><br><small>مدير النظام</small></div></div>
</aside>
<div class="wrap">
<header class="bar"><label class="srch" style="margin:0"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input placeholder="ابحث سريع..."></label>
<div class="bar-r"><div class="bell"><svg class="i" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/></svg><i></i></div><div class="av">A</div></div></header>
<main id="main"></main>
</div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script>
// ---------- التخزين (في متصفح المستخدم) ----------
const KEY='erp_data_v1';
const seed={
  items:[{id:1,name:'Coffee Beans',barcode:'1001',unit:'كجم',price:250,min:5,qty:20},{id:2,name:'Latte',barcode:'1002',unit:'كوب',price:75,min:10,qty:40},{id:3,name:'Milk',barcode:'1003',unit:'لتر',price:40,min:10,qty:6}],
  customers:[{id:1,name:'Walk-in Customer',phone:'01000000005',active:true},{id:2,name:'Corporate Client',phone:'01000000006',active:true}],
  employees:[{id:1,name:'Admin User',job:'مدير',dept:'HR',salary:5000,active:true},{id:2,name:'Cashier One',job:'كاشير',dept:'Sales',salary:3500,active:true}],
  users:[{id:1,name:'Ahmed',role:'Admin'}],
  sales:[]
};
let db;
try{db=JSON.parse(localStorage.getItem(KEY))||seed}catch(e){db=seed}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const nid=a=>a.length?Math.max(...a.map(x=>x.id))+1:1;
const $=s=>document.querySelector(s);
const money=n=>Number(n).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- النوافذ ----------
function modal(html){$('#box').innerHTML=html;$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
function form(title,fields,onSave){
  modal(`<h3 style="margin:0 0 6px">${title}</h3>`+fields.map(f=>`<label>${f.l}</label>`+(f.opts?`<select id="f_${f.k}">${f.opts.map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${f.v??''}">`)).join('')+
  `<div class="row"><button class="btn" id="ok">حفظ</button><button class="btn l" onclick="closeM()">إلغاء</button></div>`);
  $('#ok').onclick=()=>{const o={};fields.forEach(f=>{let v=$('#f_'+f.k).value;o[f.k]=f.t==='number'?Number(v)||0:v});if(!o[fields[0].k]){$('#f_'+fields[0].k).focus();return}onSave(o);save();closeM();go(cur)};
}

// ---------- الصفحات ----------
const pages={
dash(){
  const today=new Date().toDateString();
  const ts=db.sales.filter(s=>new Date(s.date).toDateString()===today);
  const total=ts.reduce((a,s)=>a+s.total,0);
  const low=db.items.filter(i=>i.qty<=i.min);
  const days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const last=[...Array(7)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-(6-k));return{n:days[d.getDay()],v:db.sales.filter(s=>new Date(s.date).toDateString()===d.toDateString()).reduce((a,s)=>a+s.total,0)}});
  const mx=Math.max(1,...last.map(x=>x.v));
  const pay=db.employees.filter(e=>e.active).reduce((a,e)=>a+e.salary,0);
  return `<h2>نظرة عامة على النظام</h2><p class="sub">ملخص الأداء والمؤشرات الرئيسية لليوم</p>
  <div class="grid">${stat('إجمالي المبيعات اليوم',money(total),'cash','c1','من '+ts.length+' فاتورة')}${stat('عدد الفواتير اليوم',ts.length,'receipt','c2','فاتورة اليوم')}${stat('تكلفة الرواتب (الشهر)',money(pay),'users','c3','الشهر الحالي')}${stat('إجمالي ديون الموردين',money(0),'alert','c4','لا يوجد مستحق')}</div>
  <div class="two"><div class="card"><h3>المبيعات (آخر 7 أيام)</h3><div class="bars" style="margin-bottom:30px">${last.map(x=>`<div style="height:${x.v/mx*100}%" title="${money(x.v)}"><span>${x.n}</span></div>`).join('')}</div></div>
  <div class="card"><h3>تنبيهات المخزون <span class="tag w">${low.length} عناصر</span></h3><div class="scroll"><table><tr><th>الصنف</th><th>الكمية</th></tr>${low.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td></tr>`).join('')||'<tr><td colspan=2 class="empty">المخزون بحالة جيدة، لا توجد تنبيهات</td></tr>'}</table></div></div></div>`;
},
inv(){
  return `<div class="top"><div><h2>المخزون والمستودعات</h2><p class="sub">إدارة الأصناف والكميات</p></div><button class="btn" onclick="addItem()">+ إضافة صنف جديد</button></div>
  <div class="card scroll"><table><tr><th>#</th><th>اسم الصنف</th><th>الباركود</th><th>الوحدة</th><th>السعر</th><th>الكمية</th><th>الحالة</th><th></th></tr>
  ${db.items.map(i=>`<tr><td>${i.id}</td><td>${esc(i.name)}</td><td>${esc(i.barcode)}</td><td>${esc(i.unit)}</td><td>${money(i.price)}</td><td>${i.qty}</td><td><span class="tag ${i.qty<=i.min?'w':''}">${i.qty<=i.min?'تنبيه نفاد':'متوفر'}</span></td><td><button class="btn r" onclick="del('items',${i.id})">حذف</button></td></tr>`).join('')}</table></div>`;
},
cust(){
  return `<div class="top"><div><h2>العملاء</h2><p class="sub">إدارة سجلات العملاء وحساباتهم</p></div><button class="btn" onclick="addCust()">+ إضافة عميل</button></div>
  <div class="grid"><div class="card"><small>إجمالي العملاء</small><div class="big">${db.customers.length}</div></div></div>
  <div class="card scroll"><table><tr><th>اسم العميل</th><th>الهاتف</th><th>عدد الفواتير</th><th>الحالة</th><th></th></tr>
  ${db.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${db.sales.filter(s=>s.cust==c.id).length}</td><td><span class="tag">نشط</span></td><td><button class="btn r" onclick="del('customers',${c.id})">حذف</button></td></tr>`).join('')}</table></div>`;
},
hr(){
  return `<div class="top"><div><h2>الموارد البشرية</h2><p class="sub">إدارة الموظفين ومسير الرواتب</p></div><button class="btn" onclick="addEmp()">+ إضافة موظف جديد</button></div>
  <div class="card scroll"><table><tr><th>الاسم</th><th>الوظيفة</th><th>القسم</th><th>الراتب</th><th>الحالة</th><th></th></tr>
  ${db.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.job)}</td><td>${esc(e.dept)}</td><td>${money(e.salary)}</td><td><span class="tag">نشط</span></td><td><button class="btn r" onclick="del('employees',${e.id})">حذف</button></td></tr>`).join('')}</table></div>`;
},
sales(){
  window.cart=window.cart||[];
  return `<h2>سلة المشتريات</h2><p class="sub">أضف المنتجات ثم أتمم عملية البيع</p>
  <div class="two"><div class="card"><label>العميل</label><select id="cu">${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
  <div class="scroll"><table id="ct"></table></div>
  <label>الخصم</label><input id="disc" type="number" value="0" min="0" oninput="drawCart()">
  <p>الإجمالي النهائي</p><div class="tot" id="tt"></div>
  <div class="row"><button class="btn g" onclick="checkout()">✓ إتمام عملية البيع</button><button class="btn l" onclick="window.print()">طباعة الفاتورة</button></div></div>
  <div class="card"><input id="q" placeholder="ابحث بالباركود أو اسم المنتج..." oninput="drawProds()"><div class="prods" id="pr"></div></div></div>`;
},
users(){
  return `<div class="top"><div><h2>إدارة المستخدمين</h2><p class="sub">إدارة حسابات المستخدمين والصلاحيات</p></div><button class="btn" onclick="addUser()">+ إضافة مستخدم</button></div>
  <div class="card scroll"><table><tr><th>اسم المستخدم</th><th>الصلاحية</th><th></th></tr>
  ${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td><button class="btn r" onclick="del('users',${u.id})">حذف</button></td></tr>`).join('')}</table></div>`;
},
soon(){return `<h2>${menu.find(m=>m[0]===cur)[1]}</h2><p class="sub">هذه الوحدة قيد التطوير</p>`}
};

// ---------- العمليات ----------
function del(t,id){if(confirm('هل تريد الحذف؟')){db[t]=db[t].filter(x=>x.id!==id);save();go(cur)}}
const addItem=()=>form('إضافة صنف جديد',[{k:'name',l:'اسم الصنف *'},{k:'barcode',l:'الباركود'},{k:'unit',l:'الوحدة',opts:['قطعة','كجم','لتر','كوب']},{k:'price',l:'سعر البيع',t:'number'},{k:'min',l:'الحد الأدنى',t:'number'},{k:'qty',l:'الكمية الحالية',t:'number'}],o=>db.items.push({id:nid(db.items),...o}));
const addCust=()=>form('إضافة عميل',[{k:'name',l:'اسم العميل *'},{k:'phone',l:'الهاتف'}],o=>db.customers.push({id:nid(db.customers),...o,active:true}));
const addEmp=()=>form('إضافة موظف جديد',[{k:'name',l:'اسم الموظف *'},{k:'job',l:'الوظيفة'},{k:'dept',l:'القسم',opts:['HR','Sales','Production']},{k:'salary',l:'الراتب',t:'number'}],o=>db.employees.push({id:nid(db.employees),...o,active:true}));
const addUser=()=>form('إضافة مستخدم جديد',[{k:'name',l:'اسم المستخدم *'},{k:'role',l:'الصلاحية',opts:['Admin','Cashier','Viewer']}],o=>db.users.push({id:nid(db.users),...o}));
function drawProds(){const q=($('#q')?.value||'').toLowerCase();$('#pr').innerHTML=db.items.filter(i=>(i.name+i.barcode).toLowerCase().includes(q)).map(i=>`<div class="prod" onclick="addCart(${i.id})"><b>${esc(i.name)}</b><br><span style="color:var(--pri)">${money(i.price)}</span><br><small>اضغط للإضافة</small></div>`).join('')}
function addCart(id){const l=cart.find(c=>c.id===id);l?l.n++:cart.push({id,n:1});drawCart()}
function drawCart(){
  const rows=cart.map(c=>{const i=db.items.find(x=>x.id===c.id);return{i,c}}).filter(r=>r.i);
  $('#ct').innerHTML='<tr><th>الصنف</th><th>الكمية</th><th>الإجمالي</th><th></th></tr>'+rows.map(({i,c})=>`<tr><td>${esc(i.name)}</td><td>${c.n}</td><td>${money(i.price*c.n)}</td><td><button class="btn r" onclick="cart=cart.filter(x=>x.id!==${i.id});drawCart()">حذف</button></td></tr>`).join('');
  const sub=rows.reduce((a,{i,c})=>a+i.price*c.n,0);window.total=Math.max(0,sub-(Number($('#disc').value)||0));$('#tt').textContent=money(window.total);
}
function checkout(){
  if(!cart.length)return alert('السلة فارغة');
  cart.forEach(c=>{const i=db.items.find(x=>x.id===c.id);if(i)i.qty-=c.n});
  db.sales.push({id:nid(db.sales),cust:Number($('#cu').value),total:window.total,date:new Date().toISOString()});
  cart=[];save();alert('تمت عملية البيع بنجاح');go('dash');
}

// ---------- التنقل ----------
const IC={home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',factory:'<path d="M3 21V9l6 4V9l6 4V5h6v16z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M17 4.5a3.5 3.5 0 0 1 0 7M22 20a7 7 0 0 0-4-6.3"/>',receipt:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>',key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/>',shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>',cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const stat=(l,v,i,c,h)=>`<div class="card stat"><div><small>${l}</small><div class="big">${v}</div><div class="hint">${h}</div></div><div class="ico ${c}">${ic(i)}</div></div>`;

const menu=[['dash','لوحة التحكم','home'],['inv','المخزون والمستودعات','box'],['cust','العملاء','user'],['prod','الرئيسي والإنتاج','factory'],['hr','الموارد البشرية','users'],['sales','المبيعات والفواتير','receipt'],['perm','الصلاحيات','key'],['users','إدارة المستخدمين','shield'],['set','الإعدادات','cog']];
let cur='dash';
function go(p){
  cur=p;
  $('#nav').innerHTML=menu.map(m=>`<a tabindex="0" class="${m[0]===p?'on':''}" onclick="go('${m[0]}')">${ic(m[2])}${m[1]}</a>`).join('');
  $('#main').innerHTML=(pages[p]||pages.soon)();
  if(p==='sales'){drawProds();drawCart()}
}
