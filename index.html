<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">ERP System</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e2e8f0;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-color: #020617;
            --sidebar-bg: #090d16;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 260px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; justify-content: space-between; border-left: 1px solid var(--border); animation: slideInRight 0.6s ease-out; }
        [data-lang="en"] .sidebar { border-left: none; border-right: 1px solid var(--border); animation: slideInLeft 0.6s ease-out; }

        .sidebar-header { padding: 20px; font-size: 20px; font-weight: bold; color: #38bdf8; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .sidebar-menu { list-style: none; padding: 15px 0; overflow-y: auto; flex-grow: 1; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: var(--text-muted); text-decoration: none; font-size: 15px; transition: var(--transition); }
        .sidebar-menu li a:hover, .sidebar-menu li.active a { background-color: rgba(56, 189, 248, 0.1); color: #38bdf8; transform: translateX(-5px); }
        [data-lang="en"] .sidebar-menu li a:hover, [data-lang="en"] .sidebar-menu li.active a { transform: translateX(5px); }

        .main-content { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; animation: fadeIn 0.8s ease-in-out; }
        .topbar { background: var(--card-bg); height: 70px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        
        .controls-group { display: flex; align-items: center; gap: 15px; }
        .control-btn { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: var(--transition); }
        .control-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }

        .content-body { padding: 25px; overflow-y: auto; flex-grow: 1; background-color: var(--bg-color); }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 20px; animation: fadeInUp 0.5s ease-out; border: 1px solid var(--border); }
        
        .btn { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: var(--transition); box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3); }
        .btn:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid var(--border); padding: 12px; text-align: center; font-size: 14px; color: var(--text-main); }
        th { background-color: rgba(56, 189, 248, 0.05); color: var(--text-main); }
        tr { transition: var(--transition); }
        tr:hover { background-color: rgba(56, 189, 248, 0.03); transform: scale(1.002); }

        .grid-form { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input { padding: 10px; border: 1px solid var(--border); border-radius: 8px; outline: none; background: var(--card-bg); color: var(--text-main); transition: var(--transition); }
        .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        .form-group button { grid-column: span 3; margin-top: 10px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    </style>
</head>
<body data-lang="ar" data-theme="dark">

    <div class="sidebar">
        <div>
            <div class="sidebar-header">🔷 <span data-i18n="sysName">ERP System</span></div>
            <ul class="sidebar-menu">
                <li class="active"><a href="#">📊 <span data-i18n="menuInv">Inventory</span></a></li>
            </ul>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="ابحث..." style="padding: 8px 15px; width: 300px; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); color: var(--text-main); outline: none;" onkeyup="searchTable()">
            <div class="controls-group">
                <button class="control-btn" onclick="toggleLanguage()">🌐 <span id="langText">English</span></button>
                <button class="control-btn" onclick="toggleTheme()">🌓 <span data-i18n="themeBtn">Theme</span></button>
            </div>
        </div>

        <div class="content-body">
            <h2 data-i18n="pageTitle" style="margin-bottom: 20px;">إدارة المخزن</h2>

            <div class="card">
                <h3 data-i18n="formTitle" style="margin-bottom: 15px;">إضافة صنف جديد</h3>
                <form id="productForm" class="grid-form" onsubmit="addProduct(event)">
                    <div class="form-group">
                        <label data-i18n="lblName">اسم الصنف</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="lblBarcode">الباركود</label>
                        <input type="text" id="barcode" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="lblUnit">الوحدة</label>
                        <input type="text" id="unit" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="lblCat">التصنيف</label>
                        <input type="text" id="category">
                    </div>
                    <div class="form-group">
                        <label data-i18n="lblBuy">سعر الشراء</label>
                        <input type="number" step="0.01" id="buy_price" value="0">
                    </div>
                    <div class="form-group">
                        <label data-i18n="lblSell">سعر البيع</label>
                        <input type="number" step="0.01" id="sell_price" required value="0">
                    </div>
                    <div class="form-group">
                        <label data-i18n="lblQty">الكمية</label>
                        <input type="number" id="stock_quantity" required value="0">
                    </div>
                    <div class="form-group">
                        <label data-i18n="lblMin">الحد الأدنى</label>
                        <input type="number" id="min_stock" required value="5">
                    </div>
                    <div class="form-group">
                        <label data-i18n="lblSup">المورد</label>
                        <input type="text" id="supplier">
                    </div>
                    <button type="submit" class="btn" data-i18n="btnSave">حفظ الصنف</button>
                </form>
            </div>

            <div class="card">
                <h3 data-i18n="tableTitle" style="margin-bottom: 15px;">قائمة الأصناف</h3>
                <table>
                    <thead>
                        <tr>
                            <th data-i18n="thNum">#</th>
                            <th data-i18n="thName">اسم الصنف</th>
                            <th data-i18n="thBarcode">الباركود</th>
                            <th data-i18n="thCat">التصنيف</th>
                            <th data-i18n="thUnit">الوحدة</th>
                            <th data-i18n="thBuy">سعر الشراء</th>
                            <th data-i18n="thSell">سعر البيع</th>
                            <th data-i18n="thQty">الكمية</th>
                            <th data-i18n="thSup">المورد</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            ar: {
                title: "نظام ERP",
                sysName: "نظام ERP",
                menuInv: "المخزن والمستودعات",
                searchPlaceholder: "ابحث باسم الصنف أو الباركود...",
                themeBtn: "الوضع",
                pageTitle: "إدارة المخزن والمستودعات",
                formTitle: "إضافة صنف جديد",
                lblName: "اسم الصنف *",
                lblBarcode: "الباركود *",
                lblUnit: "الوحدة *",
                lblCat: "التصنيف",
                lblBuy: "سعر الشراء",
                lblSell: "سعر البيع *",
                lblQty: "الكمية الحالية *",
                lblMin: "الحد الأدنى *",
                lblSup: "المورد",
                btnSave: "حفظ الصنف في المخزن",
                tableTitle: "قائمة الأصناف الحالية",
                thNum: "#",
                thName: "اسم الصنف",
                thBarcode: "الباركود",
                thCat: "التصنيف",
                thUnit: "الوحدة",
                thBuy: "سعر الشراء",
                thSell: "سعر البيع",
                thQty: "الكمية",
                thSup: "المورد",
                emptyData: "لا توجد أصناف مضافة حتى الآن."
            },
            en: {
                title: "ERP System",
                sysName: "ERP System",
                menuInv: "Inventory & Warehouses",
                searchPlaceholder: "Search by name or barcode...",
                themeBtn: "Theme",
                pageTitle: "Inventory Management",
                formTitle: "Add New Product",
                lblName: "Product Name *",
                lblBarcode: "Barcode *",
                lblUnit: "Unit *",
                lblCat: "Category",
                lblBuy: "Buy Price",
                lblSell: "Sell Price *",
                lblQty: "Stock Quantity *",
                lblMin: "Min Stock *",
                lblSup: "Supplier",
                btnSave: "Save Product",
                tableTitle: "Current Products List",
                thNum: "#",
                thName: "Product Name",
                thBarcode: "Barcode",
                thCat: "Category",
                thUnit: "Unit",
                thBuy: "Buy Price",
                thSell: "Sell Price",
                thQty: "Quantity",
                thSup: "Supplier",
                emptyData: "No products added yet."
            }
        };

        let currentLang = 'ar';
        let products = [];

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const html = document.getElementById('htmlRoot');
            html.setAttribute('lang', currentLang);
            html.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.body.setAttribute('data-lang', currentLang);
            document.getElementById('langText').innerText = currentLang === 'ar' ? 'English' : 'عربي';
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[currentLang][key]) {
                    el.setAttribute('placeholder', translations[currentLang][key]);
                }
            });
            renderTable();
        }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            body.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }

        function addProduct(event) {
            event.preventDefault();
            const newProduct = {
                name: document.getElementById('name').value,
                barcode: document.getElementById('barcode').value,
                unit: document.getElementById('unit').value,
                category: document.getElementById('category').value,
                buy_price: document.getElementById('buy_price').value,
                sell_price: document.getElementById('sell_price').value,
                stock_quantity: document.getElementById('stock_quantity').value,
                min_stock: document.getElementById('min_stock').value,
                supplier: document.getElementById('supplier').value
            };
            products.push(newProduct);
            renderTable();
            document.getElementById('productForm').reset();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            if (products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="color: var(--text-muted); padding: 20px;">${translations[currentLang].emptyData}</td></tr>`;
                return;
            }
            products.forEach((p, index) => {
                let stockStyle = p.stock_quantity <= p.min_stock ? 'background: rgba(239, 68, 68, 0.2); color: #ef4444;' : 'background: rgba(34, 197, 94, 0.2); color: #22c55e;';
                let row = `<tr>
                    <td>${index + 1}</td>
                    <td>${p.name}</td>
                    <td>${p.barcode}</td>
                    <td>${p.category || '-'}</td>
                    <td>${p.unit}</td>
                    <td>${p.buy_price}</td>
                    <td>${p.sell_price}</td>
                    <td><span style="padding: 4px 8px; border-radius: 6px; ${stockStyle}">${p.stock_quantity}</span></td>
                    <td>${p.supplier || '-'}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function searchTable() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                let text = row.innerText.toLowerCase();
                row.style.display = text.includes(input) ? '' : 'none';
            });
        }
    </script>
</body>
</html>
